#-- Project Information
site_name: 'Cornerstone Indice Docs'
site_description: 'Official Documentation for the Cornerstone Indice Bot.'
site_author: 'The Cornerstone Indice Team'
site_url: 'https://docs.cornerstone-indice.com'

#-- Repository
repo_name: 'Cornerstone-Indice/docs'
repo_url: 'https://github.com/Cornerstone-Indice/docs'
edit_uri: 'edit/main/docs/'

#-- Theme & Appearance
theme:
  name: 'material'
  language: en
  palette:
    # Palette toggle for light vs dark mode
    - scheme: default
      primary: 'indigo'
      accent: 'indigo'
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: 'black'
      accent: 'indigo'
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github-alt

#-- Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

#-- Plugins
plugins:
  - search:
      lang: ['en', 'fr']
  - git-revision-date-localized:
      type: timeago

#-- Extra Features
extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: Français
      link: /fr/
      lang: fr
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  feedback:
    title: Was this page helpful?
    ratings:
      - icon: "😞"
        name: "Not helpful"
        data: 0
        note: "Thanks for your feedback! We'll use it to improve this page."
      - icon: "😊"
        name: "Helpful"
        data: 1
        note: "Thanks for your feedback!"
  en:
    nav:
      - 'Home': 'index.md'
      - 'Freemium Journey':
      - 'Core Concepts':
          - 'Pattern vs. Signal': 'core_concepts/pattern_vs_signal.md'
          - 'The Confidence Score': 'core_concepts/confidence_score.md'
      - 'Pro Journey':
        - 'Trader''s Cookbook':
          - 'Backtesting Signals': 'pro_journey/cookbook/backtesting_python.md'
          - 'Risk Management': 'pro_journey/cookbook/risk_management.md'
          - 'Weekend Risk Protocol': 'pro_journey/cookbook/weekend_risk.md'
      - 'Features':
        - 'HarmoGrid': 'features/harmogrid.md'
        - 'Performance Dashboard': 'features/performance_dashboard.md'
        - 'AlphaGate Integration': 'features/alphagate_integration.md'
        - 'Pine Script Generator': 'features/pine_script_generator.md'
        - 'Gann Projections': 'features/gann_projections.md'
        - 'Fundamental Analysis': 'features/fundamental_analysis.md'
      - 'Quant Journey':
        - 'API Reference':
          - 'Data Endpoints': 'quant_journey/api/data_endpoints.md'
          - 'Data Models': 'quant_journey/api/data_models.md'
        - 'Architecture': 'quant_journey/architecture.md'
      - 'Resources':
        - 'Alpha Glossary': 'resources/alpha_glossary.md'
        - 'Performance Report Q4': 'resources/PERFORMANCE_REPORT_Q4.md'
      - 'Legal':
        - 'Risk Disclaimer': 'legal/risk_disclaimer.md'
  fr:
    nav:
      - 'Accueil': 'index.md'
      - 'Parcours Freemium':
        - 'Démarrage Rapide': 'getting_started.md'
        - 'Concepts Clés':
          - 'Pattern vs. Signal': 'core_concepts/pattern_vs_signal.md'
          - 'Le Score de Confiance': 'core_concepts/confidence_score.md'
      - 'Parcours Pro':
        - 'Recettes du Trader':
          - 'Backtester les Signaux': 'pro_journey/cookbook/backtesting_python.md'
          - 'Gestion du Risque': 'pro_journey/cookbook/risk_management.md'
          - 'Protocole Risque Weekend': 'pro_journey/cookbook/weekend_risk.md'
      - 'Fonctionnalités':
        - 'HarmoGrid': 'features/harmogrid.md'
        - 'Tableau de Bord de Performance': 'features/performance_dashboard.md'
        - 'Intégration AlphaGate': 'features/alphagate_integration.md'
        - 'Générateur Pine Script': 'features/pine_script_generator.md'
        - 'Projections de Gann': 'features/gann_projections.md'
        - 'Analyse Fondamentale': 'features/fundamental_analysis.md'
      - 'Parcours Quant':
        - 'Référence API':
          - 'Points d''Accès aux Données': 'quant_journey/api/data_endpoints.md'
          - 'Modèles de Données': 'quant_journey/api/data_models.md'
        - 'Architecture': 'quant_journey/architecture.md'
      - 'Ressources':
        - 'Glossaire Alpha': 'resources/alpha_glossary.md'
        - 'Rapport de Performance Q4': 'resources/PERFORMANCE_REPORT_Q4.md'
